[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-team-stat-cards"
version = "0.1.0"
description = "NHL Team Stat Card generation project"
authors = [{ name = "Avery Doiron" }]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4==4.14.3",
    "CairoSVG==2.8.2",
    "inflect==7.5.0",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "pillow==12.1.1",
    "requests==2.32.5",
    "scipy==1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]